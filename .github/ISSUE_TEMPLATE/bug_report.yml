name: Bug report
description: Something does not work as expected
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        **Remove IP addresses, Wi-Fi names/passwords and other personal data before posting.**
        Security problems: do NOT report here — see SECURITY.md.
  - type: dropdown
    id: model
    attributes:
      label: Machine
      options: [MerakiTech Gen 1, MerakiTech Gen 2, Other]
    validations: {required: true}
  - type: input
    id: version
    attributes:
      label: Meraki+ version (DIAGNOSTICS → VERSION)
      placeholder: V6.25
    validations: {required: true}
  - type: dropdown
    id: area
    attributes:
      label: Area
      options: [install.sh, revert.sh, UI on the machine, gesture switcher, power button, simulator / tests, docs]
    validations: {required: true}
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: Steps, what you expected, what happened instead.
    validations: {required: true}
  - type: textarea
    id: status
    attributes:
      label: "Output of `python3 tools/merakiplus.py status --ip ADDR` and/or the log from logs/ (redacted)"
      render: text
  - type: checkboxes
    id: ack
    attributes:
      label: Checks
      options:
        - label: I removed IP addresses and other personal data
          required: true
        - label: I have read the disclaimer in the README
          required: true
