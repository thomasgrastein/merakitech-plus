name: CI

# Merge policy (CONTRIBUTING.md#how-changes-reach-main): branch protection on main requires ONE status
# check, `merge-gate`. It always runs and aggregates the others:
#   * quick     — hygiene, builds, bin/ drift, UI self-test, SIM self-test, quick E2E, switcher, launcher,
#                 signed manifests, installer. Every PR and push.
#   * full-e2e  — all scenarios in English + Danish (> 30 min). Only when code changed (see `changes`), weekly,
#                 or on request (workflow_dispatch full_e2e=true).
# Docs-only changes skip full-e2e and merge-gate still passes; code changes need full-e2e green. Requiring only
# merge-gate avoids the "skipped required check" deadlock. Do not rename the merge-gate job: its name is the
# check that branch protection requires.
#
# Hardening (docs/release-process.md "CI hardening"): read-only token, every action pinned to a full commit SHA
# (Dependabot proposes updates), no persisted git credentials, cold zig cache for the bin/ drift check. Never add
# pull_request_target / workflow_run, and never put ${{ }} expressions straight into a run: script (use env:).

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      full_e2e:
        description: "Also run the full E2E suite (EN + DA, > 30 min)"
        type: boolean
        default: false
  schedule:
    - cron: "17 3 * * 1"   # weekly full E2E gate (Mondays)

permissions:
  contents: read

concurrency:
  # a new push to a PR cancels that PR's previous run; every other run (main, schedule, dispatch) is its own group,
  # so it is never queued behind or cancelled by another run
  group: ci-${{ github.event.pull_request.number && format('pr-{0}', github.event.pull_request.number) || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  changes:
    name: detect code changes
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      code: ${{ steps.f.outputs.code }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Does this change need the full E2E suite?
        id: f
        env:
          EVENT: ${{ github.event_name }}
          BEFORE: ${{ github.event.before }}
          FULL_INPUT: ${{ inputs.full_e2e }}
        run: |
          set -eu
          # Paths whose change requires the full E2E suite. The workflow file itself is included so that a
          # change to these gates is exercised by the gate it changes.
          CODE_RE='^(src/|sim/|boot/|build\.sh$|\.github/workflows/ci\.yml$)'
          code=false
          case "$EVENT" in
            schedule) code=true ;;
            workflow_dispatch) if [ "$FULL_INPUT" = "true" ]; then code=true; fi ;;
            pull_request)
              # actions/checkout checks out the PR merge commit: parent 1 = base tip, so this is the PR's diff
              git diff --name-only HEAD^1 HEAD > changed.txt ;;
            push)
              if [ -n "${BEFORE//0/}" ] && git cat-file -e "$BEFORE^{commit}" 2>/dev/null; then
                git diff --name-only "$BEFORE" HEAD > changed.txt
              else
                code=true   # new branch / unknown base: be safe
              fi ;;
          esac
          if [ -f changed.txt ]; then
            echo "changed files:"; sed 's/^/  /' changed.txt
            if grep -Eq "$CODE_RE" changed.txt; then code=true; fi
          fi
          echo "code=$code" >> "$GITHUB_OUTPUT"
          echo "Full E2E required: **$code** ($EVENT)" >> "$GITHUB_STEP_SUMMARY"
          echo "full E2E required: $code"
      - name: Trust-anchor changes (advisory, for the reviewer)
        run: |
          # Paths that decide what users install or trust (installer, pins, keys, signing tool, gates, workflows;
          # list: TRUST_ANCHORS in tools/sign_release.py, owned via .github/CODEOWNERS). A change is not an error,
          # but it must be read with extra care — this puts it on the run summary and as a warning on the PR.
          if [ -f changed.txt ]; then python3 tests/hygiene.py --trust-anchors changed.txt; fi

  quick:
    name: build + quick tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29 # v2.2.1
        with:
          version: 0.17.1
          # cold build: the bin/ drift check below must compare against a build from an EMPTY zig cache, never one
          # restored from (or saved for) another run (docs/release-process.md "CI hardening")
          use-cache: false
      - name: Repository hygiene (checksums, no vendor files, no personal data)
        run: python3 tests/hygiene.py
      - name: Build (host SIM, switcher, self-tests)
        run: ./build.sh host
      - name: Cross-build device binaries (ARMv7, 0 errors)
        run: ./build.sh
      - name: Cross-build Linux SIM (x86_64 musl, static, stripped)
        run: zig cc -target x86_64-linux-musl -DMERAKIPLUS_SIM -O2 -static -s src/merakiplus.c -lm -o build/merakiplus_sim-linux-x86_64
      - name: bin/ drift check (committed binaries == fresh builds)
        run: python3 tests/check_bins.py
      - name: UI self-test (preview build, 440+ checks)
        run: |
          zig cc -DMERAKIPLUS_PREVIEW -O2 -o build/merakiplus_preview src/merakiplus.c -lm
          ./build/merakiplus_preview --selftest sim/fixtures/config.json > build/ui_selftest.txt 2>&1 || { tail -50 build/ui_selftest.txt; exit 1; }
          tail -n 1 build/ui_selftest.txt
      - name: Simulator self-test
        run: python3 sim/selftest.py
      - name: E2E quick (5 core scenarios against the real UI SIM build)
        run: python3 sim/run_e2e.py --all --quick --parallel 4
      - name: Gesture switcher end-to-end (file mode)
        run: python3 boot/test_switcher.py
      - name: Launcher (vendor-watchdog model + power-cut replay)
        run: python3 tests/test_launcher.py
      - name: Signed release manifests (both verifiers, signing tool, workflow manifest step)
        run: python3 tests/test_upd.py
      - name: On-device HTTPS check + install (the updater against a local TLS server; OTA phase 3)
        run: python3 tests/test_ota_fetch.py
      - name: Installer / revert against the mock display
        run: python3 tests/test_installer.py
      - name: Upload reports
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: quick-reports
          path: |
            sim/reports/
            build/ui_selftest.txt
          if-no-files-found: ignore

  full-e2e:
    name: full E2E gate (EN + DA)
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29 # v2.2.1
        with:
          version: 0.17.1
      - run: ./build.sh host
      - name: Full E2E, English
        env:
          E2E_LANG: en
        run: |
          # Some timing-window checks are load-sensitive under --parallel 4 on a shared runner. A failed
          # pass re-runs each failed scenario ONCE, alone (no parallel load). It still fails when a retry
          # fails, when more than 3 scenarios failed, or when the run failed without a scenario failure.
          # Every retry is reported as a warning, so flaky scenarios stay visible.
          set -o pipefail
          mkdir -p build
          log="build/full-$E2E_LANG.log"
          if python3 sim/run_e2e.py --all --parallel 4 --ui-lang "$E2E_LANG" --run-name "full-$E2E_LANG" 2>&1 | tee "$log"; then
            exit 0
          fi
          failed=$(sed -n 's/^\[e2e\] \([A-Za-z0-9_.-]*\): FAIL.*/\1/p' "$log" | sort -u)
          n=$(printf '%s' "$failed" | grep -c . || true)
          if [ "$n" -eq 0 ] || [ "$n" -gt 3 ]; then
            echo "::error::full E2E ($E2E_LANG): $n scenario failure(s) — not retrying"; exit 1
          fi
          for sc in $failed; do
            echo "::warning::full E2E ($E2E_LANG): $sc failed under parallel load — retrying once, alone"
            python3 sim/run_e2e.py --scenario "$sc" --ui-lang "$E2E_LANG" --run-name "retry-$E2E_LANG-$sc" \
              || { echo "::error::full E2E ($E2E_LANG): $sc failed again on retry"; exit 1; }
          done
          echo "full E2E ($E2E_LANG): passed after retrying: $failed" | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Full E2E, Danish
        # run even when the English pass failed, so one run reports both languages
        if: success() || failure()
        env:
          E2E_LANG: da
        run: |
          # Some timing-window checks are load-sensitive under --parallel 4 on a shared runner. A failed
          # pass re-runs each failed scenario ONCE, alone (no parallel load). It still fails when a retry
          # fails, when more than 3 scenarios failed, or when the run failed without a scenario failure.
          # Every retry is reported as a warning, so flaky scenarios stay visible.
          set -o pipefail
          mkdir -p build
          log="build/full-$E2E_LANG.log"
          if python3 sim/run_e2e.py --all --parallel 4 --ui-lang "$E2E_LANG" --run-name "full-$E2E_LANG" 2>&1 | tee "$log"; then
            exit 0
          fi
          failed=$(sed -n 's/^\[e2e\] \([A-Za-z0-9_.-]*\): FAIL.*/\1/p' "$log" | sort -u)
          n=$(printf '%s' "$failed" | grep -c . || true)
          if [ "$n" -eq 0 ] || [ "$n" -gt 3 ]; then
            echo "::error::full E2E ($E2E_LANG): $n scenario failure(s) — not retrying"; exit 1
          fi
          for sc in $failed; do
            echo "::warning::full E2E ($E2E_LANG): $sc failed under parallel load — retrying once, alone"
            python3 sim/run_e2e.py --scenario "$sc" --ui-lang "$E2E_LANG" --run-name "retry-$E2E_LANG-$sc" \
              || { echo "::error::full E2E ($E2E_LANG): $sc failed again on retry"; exit 1; }
          done
          echo "full E2E ($E2E_LANG): passed after retrying: $failed" | tee -a "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: full-e2e-reports
          # sandboxes hold FIFOs/sockets and ~170 MB of framebuffers; reports + state logs suffice
          path: |
            sim/reports/
            !sim/reports/**/sandbox/**
            build/full-*.log

  merge-gate:
    # THE required status check on main. Always runs (also when a dependency failed or was skipped) so
    # it always reports a result; never rename it without updating branch protection first.
    name: merge-gate
    needs: [changes, quick, full-e2e]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: All required jobs passed
        env:
          CHANGES: ${{ needs.changes.result }}
          CODE: ${{ needs.changes.outputs.code }}
          QUICK: ${{ needs.quick.result }}
          FULL: ${{ needs.full-e2e.result }}
        run: |
          echo "changes=$CHANGES (code=$CODE)  quick=$QUICK  full-e2e=$FULL"
          ok=true
          [ "$CHANGES" = "success" ] || { echo "::error::change detection did not succeed ($CHANGES)"; ok=false; }
          [ "$QUICK" = "success" ]   || { echo "::error::quick gate did not succeed ($QUICK)"; ok=false; }
          if [ "$CODE" = "true" ]; then
            [ "$FULL" = "success" ] || { echo "::error::code changed: full E2E must succeed ($FULL)"; ok=false; }
          else
            case "$FULL" in success|skipped) ;; *) echo "::error::full E2E did not succeed ($FULL)"; ok=false ;; esac
          fi
          if $ok; then
            echo "merge-gate: PASS" | tee -a "$GITHUB_STEP_SUMMARY"
          else
            echo "merge-gate: FAIL" | tee -a "$GITHUB_STEP_SUMMARY"; exit 1
          fi
