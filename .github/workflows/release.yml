name: Release

# Builds the GitHub release of Meraki+ as a DRAFT. Publishing is the maintainer's offline step (docs/release-process.md):
#
#   merge to main (VERSION bump) -> this workflow: build + test gate -> DRAFT release vX.Y (unsigned assets,
#   manifest.unsigned.json)  ->  maintainer: tools/sign_release.py sign vX.Y --upload  (rebuild + byte compare, diff
#   review since the last signed tag, key-pin check, sign, upload manifest.json + manifest.sig, PUBLISH)
#
# A draft is invisible to the public and creates no git tag, so no unsigned release is ever public. With immutable
# releases on, a published release (assets + tag) cannot be changed afterwards — not by CI, not by anyone.
#
# Triggers — main only:
#   * push to main          -> only when VERSION is stable and newer than the latest published release (else: skip)
#   * workflow_dispatch     -> same version check; refused unless started on main (e.g. to rebuild a deleted draft)
# There is no tag trigger: a tag is created only when the maintainer publishes the signed draft.
#
# Idempotency: CI never changes an existing release. If a draft (or a published release) for the version exists, the
# run reports it and stops. To rebuild a draft: delete it (`gh release delete vX.Y`) and dispatch this workflow.
#
# Assets: the committed bin/ builds (source of truth for the installer). tests/check_bins.py verifies they are
# byte-identical to fresh zig 0.17.1 builds (cold cache) before anything is uploaded — every installed binary,
# including grab_shim.so (deterministically trimmed, see build.sh). The macOS SIM asset is the committed build made
# on macOS (Mach-O is not bit-reproducible); tests/hygiene.py md5-gates it against bin/MD5SUMS. Every installed file
# is listed in MD5SUMS and SHA256SUMS; tests/hygiene.py checks that the installer's pinned tables match the files.
#
# Least privilege: the workflow token is read-only; only the `publish` job gets contents: write, and it runs no repository
# code and no third-party action (only the pinned, GitHub-owned download-artifact). Every action is pinned to a full
# commit SHA. No checkout persists credentials. CI never has the signing key and cannot sign.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  check:
    name: version check
    # main only: a dispatch on any other branch (or a fork's ref) never reaches the build or publish jobs
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      needed: ${{ steps.v.outputs.needed }}
      version: ${{ steps.v.outputs.version }}
      tag: ${{ steps.v.outputs.tag }}
      target: ${{ steps.v.outputs.target }}
      prerelease: ${{ steps.v.outputs.prerelease }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Decide whether a release is needed (and for which version)
        id: v
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PY'
          import os, re, subprocess, sys

          def gh(*args):
              return subprocess.run(["gh", *args], capture_output=True, text=True)

          repo = os.environ["GITHUB_REPOSITORY"]
          event = os.environ["GITHUB_EVENT_NAME"]
          ref = os.environ["GITHUB_REF"]
          sha = os.environ["GITHUB_SHA"]

          src = open("tools/merakiplus.py", encoding="utf-8").read()
          version = re.search(r'^VERSION\s*=\s*"([^"]+)"', src, re.M).group(1)
          csrc = open("src/merakiplus.c", encoding="utf-8").read()
          cver = re.search(r'#define\s+MERAKIPLUS_VERSION\s+"V([^"]+)"', csrc).group(1)
          if cver != version:
              sys.exit(f"version mismatch: tools/merakiplus.py VERSION={version} "
                       f"but src/merakiplus.c MERAKIPLUS_VERSION=V{cver}")

          stable = re.fullmatch(r"\d+\.\d+(?:\.\d+)?", version) is not None
          vkey = lambda v: tuple(int(x) for x in re.findall(r"\d+", v))
          release_exists = lambda tag: gh("release", "view", tag, "--repo", repo,
                                          "--json", "tagName").returncode == 0

          if ref != "refs/heads/main":
              sys.exit(f"release.yml runs on main only (got {ref})")
          needed, target, tag = False, sha, "v" + version
          if release_exists(tag):                 # published (a read-only token does not see drafts)
              print(f"release {tag} is already published; CI never changes a published release")
          elif event == "push" and not stable:
              print(f"VERSION {version} is not stable; main pushes only auto-release stable versions")
          else:
              r = gh("api", f"repos/{repo}/releases/latest", "--jq", ".tag_name")
              latest = r.stdout.strip() if r.returncode == 0 else ""
              if latest and vkey(version) <= vkey(latest.lstrip("v")):
                  print(f"VERSION {version} is not newer than latest release {latest}; nothing to do")
              else:
                  needed = True
                  print(f"VERSION {version} is newer than latest release {latest or '(none)'}; building a draft")

          with open(os.environ["GITHUB_OUTPUT"], "a") as f:
              f.write(f"needed={'true' if needed else 'false'}\n")
              f.write(f"version={version}\n")
              f.write(f"tag={tag}\n")
              f.write(f"target={target}\n")
              f.write(f"prerelease={'false' if stable else 'true'}\n")
          summary = (f"Release check: **{tag}** — " +
                     ("build + draft release" if needed else "skip, nothing to release") +
                     f" (VERSION {version}, {'stable' if stable else 'prerelease'})")
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a") as f:
              f.write(summary + "\n")
          print(summary)
          PY

  build:
    name: build + test gate
    needs: check
    if: needs.check.outputs.needed == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # read-only token (workflow default): this job runs repository code and a third-party action, so it must not be
    # able to push, move tags or change/delete release assets
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29 # v2.2.1
        with:
          version: 0.17.1
          use-cache: false        # cold build: never restore (or save) a zig cache for the release build
      - name: Repository hygiene (checksums, no vendor files, no personal data)
        run: python3 tests/hygiene.py
      - name: Build (device ARMv7 + host SIM + self-tests)
        run: ./build.sh
      - name: Cross-build Linux SIM (x86_64 musl, static, stripped)
        run: zig cc -target x86_64-linux-musl -DMERAKIPLUS_SIM -O2 -static -s src/merakiplus.c -lm -o build/merakiplus_sim-linux-x86_64
      - name: bin/ drift check (committed binaries == fresh builds)
        run: python3 tests/check_bins.py
      - name: UI self-test (preview build)
        run: |
          zig cc -DMERAKIPLUS_PREVIEW -O2 -o build/merakiplus_preview src/merakiplus.c -lm
          ./build/merakiplus_preview --selftest sim/fixtures/config.json > build/ui_selftest.txt 2>&1 || { tail -50 build/ui_selftest.txt; exit 1; }
          tail -n 1 build/ui_selftest.txt
      - name: Simulator self-test
        run: python3 sim/selftest.py
      - name: E2E quick (core scenarios against the real UI SIM build)
        run: python3 sim/run_e2e.py --all --quick --parallel 4
      - name: Gesture switcher end-to-end (file mode)
        run: python3 boot/test_switcher.py
      - name: Launcher (vendor-watchdog model + power-cut replay)
        run: python3 tests/test_launcher.py
      - name: Signed release manifests (both verifiers, signing tool, workflow manifest step)
        run: python3 tests/test_upd.py
      - name: Installer / revert against the mock display
        run: python3 tests/test_installer.py
      - name: Assemble release assets + notes (committed bin/, drift-checked above)
        env:
          VERSION: ${{ needs.check.outputs.version }}
        run: |
          mkdir -p dist
          files="merakiplus merakiplus_snd merakiplus_boot switcher grab_shim.so start.wav ready_extract.wav ready_steam.wav merakiplus_sim_arm merakiplus_sim-linux-x86_64 merakiplus_sim-macos-arm64"
          cp bin/merakiplus bin/merakiplus_snd bin/merakiplus_boot bin/switcher bin/grab_shim.so audio/*.wav bin/merakiplus_sim_arm bin/merakiplus_sim-linux-x86_64 bin/merakiplus_sim-macos-arm64 dist/
          (cd dist && md5sum $files > MD5SUMS && sha256sum $files > SHA256SUMS)
          # OTA phase 2 (docs/signing.md): an UNSIGNED manifest for comparison. CI has no signing key; the maintainer
          # signs the draft offline (tools/sign_release.py sign), uploads manifest.json + manifest.sig and publishes.
          COMMIT="$GITHUB_SHA"
          RELEASED="$(TZ=UTC git log -1 --format=%cd --date=format-local:%Y-%m-%d)"
          python3 tools/sign_release.py manifest --dir dist --version "$VERSION" --commit "$COMMIT" --released "$RELEASED" --assets $files MD5SUMS SHA256SUMS --out dist/manifest.unsigned.json
          python3 tools/release_notes.py "$VERSION" > dist/notes.md
          cat dist/MD5SUMS dist/SHA256SUMS
      - name: Upload release assets
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-assets
          path: dist/
          if-no-files-found: error
      - name: Upload reports
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-reports
          path: |
            sim/reports/
            build/ui_selftest.txt
          if-no-files-found: ignore

  publish:
    name: draft release
    needs: [check, build]
    if: needs.check.outputs.needed == 'true' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # the ONLY job with a write token; it runs no repository code (no checkout) and only GitHub's own pinned action
    permissions:
      contents: write
    steps:
      - name: Download release assets
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-assets
          path: dist
      - name: Create the DRAFT release (never changes an existing one)
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ needs.check.outputs.tag }}
          TARGET: ${{ needs.check.outputs.target }}
          PRERELEASE: ${{ needs.check.outputs.prerelease }}
        run: |
          set -eu
          title="Meraki+ ${TAG}"
          assets="dist/merakiplus dist/merakiplus_snd dist/merakiplus_boot dist/switcher dist/grab_shim.so dist/start.wav dist/ready_extract.wav dist/ready_steam.wav dist/merakiplus_sim_arm dist/merakiplus_sim-linux-x86_64 dist/merakiplus_sim-macos-arm64 dist/MD5SUMS dist/SHA256SUMS dist/manifest.unsigned.json"
          if state=$(gh release view "$TAG" --json isDraft --jq '.isDraft' 2>/dev/null); then
            if [ "$state" = "true" ]; then
              echo "::notice::draft $TAG already exists — not touched. Sign it (tools/sign_release.py sign $TAG --upload), or delete it and re-run to rebuild."
            else
              echo "::notice::release $TAG is already published — CI never changes a published release."
            fi
            exit 0
          fi
          flag=""
          if [ "$PRERELEASE" = "true" ]; then flag="--prerelease"; fi
          echo "== creating DRAFT $TAG at $TARGET (no tag until the maintainer publishes it)"
          gh release create "$TAG" --draft --target "$TARGET" --title "$title" --notes-file dist/notes.md $flag $assets
          gh release view "$TAG" --json url,isDraft,isPrerelease,assets --jq '{url: .url, draft: .isDraft, prerelease: .isPrerelease, assets: [.assets[].name]}'
          echo "Draft **$TAG** created (unsigned, not public). Next: \`tools/sign_release.py sign $TAG --upload\` on the maintainer's computer." >> "$GITHUB_STEP_SUMMARY"
