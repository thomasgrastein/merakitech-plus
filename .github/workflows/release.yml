name: Release

# Automatically maintains the GitHub releases of Meraki+.
#
# Triggers:
#   * push of a v* tag      -> build + gate, then create OR update that release
#   * workflow_dispatch     -> same, for the VERSION in tools/merakiplus.py
#   * push to main          -> auto-maintain: only when VERSION is newer than the
#                              latest published release (skips otherwise, green)
#
# Idempotency: a release that already exists for the version is edited (title, notes,
# latest/prerelease flag) and its assets replaced with --clobber — never duplicated.
# Re-running for the same version converges to the same release.
#
# Assets: the committed bin/ builds (source of truth for the raw-download installer).
# tests/check_bins.py verifies they are byte-identical to fresh zig 0.17.1 builds
# before anything is published. The macOS SIM asset is the committed build made on
# macOS: Mach-O is not bit-reproducible, so CI does not rebuild it (no macOS runner
# needed); tests/hygiene.py md5-gates it against bin/MD5SUMS. grab_shim.so is likewise
# the committed on-device-verified build. Since OTA phase 1a every installed file is a
# release asset (UI, sound helper, launcher (1b), switcher, grab_shim.so, the three WAVs), listed in both
# MD5SUMS (kept for older scripts) and SHA256SUMS; tests/hygiene.py checks that the
# installer's pinned tables (BIN_MD5/BIN_SHA256/AUDIO_MD5/AUDIO_SHA256) match the files.
# OTA phase 2 (docs/signing.md): CI also publishes manifest.unsigned.json but can NEVER sign. The maintainer signs
# offline with tools/sign_release.py (rebuild + byte compare first) and uploads manifest.json + manifest.sig. A re-run
# for an already signed release refuses to replace assets that no longer match the signed manifest.
#
# Auth: GITHUB_TOKEN only (contents: write below). No other credentials anywhere.

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  check:
    name: version check
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      needed: ${{ steps.v.outputs.needed }}
      version: ${{ steps.v.outputs.version }}
      tag: ${{ steps.v.outputs.tag }}
      target: ${{ steps.v.outputs.target }}
      prerelease: ${{ steps.v.outputs.prerelease }}
    steps:
      - uses: actions/checkout@v4
      - name: Decide whether a release is needed (and for which version)
        id: v
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PY'
          import os, re, subprocess, sys

          def gh(*args):
              return subprocess.run(["gh", *args], capture_output=True, text=True)

          repo = os.environ["GITHUB_REPOSITORY"]
          event = os.environ["GITHUB_EVENT_NAME"]
          ref = os.environ["GITHUB_REF"]
          sha = os.environ["GITHUB_SHA"]

          src = open("tools/merakiplus.py", encoding="utf-8").read()
          version = re.search(r'^VERSION\s*=\s*"([^"]+)"', src, re.M).group(1)
          csrc = open("src/merakiplus.c", encoding="utf-8").read()
          cver = re.search(r'#define\s+MERAKIPLUS_VERSION\s+"V([^"]+)"', csrc).group(1)
          if cver != version:
              sys.exit(f"version mismatch: tools/merakiplus.py VERSION={version} "
                       f"but src/merakiplus.c MERAKIPLUS_VERSION=V{cver}")

          stable = re.fullmatch(r"\d+\.\d+(?:\.\d+)?", version) is not None
          vkey = lambda v: tuple(int(x) for x in re.findall(r"\d+", v))
          release_exists = lambda tag: gh("release", "view", tag, "--repo", repo,
                                          "--json", "tagName").returncode == 0

          needed, target, tag = False, "", "v" + version
          if event == "push" and ref.startswith("refs/tags/"):
              tag = ref[len("refs/tags/"):]
              if tag != "v" + version:
                  sys.exit(f"tag {tag} does not match source VERSION {version} — "
                           "bump VERSION (tools/merakiplus.py + src/merakiplus.c) first")
              needed = True                       # create or update, idempotent
          elif event == "workflow_dispatch":
              needed = True                       # create or update, idempotent
              target = sha                        # only used if the tag does not exist yet
          else:                                   # push to main: auto-maintain
              if not stable:
                  print(f"VERSION {version} is not stable; main pushes only auto-release stable versions")
              elif release_exists(tag):
                  print(f"release {tag} already exists; nothing to do")
              else:
                  r = gh("api", f"repos/{repo}/releases/latest", "--jq", ".tag_name")
                  latest = r.stdout.strip() if r.returncode == 0 else ""
                  if latest and vkey(version) <= vkey(latest.lstrip("v")):
                      print(f"VERSION {version} is not newer than latest release {latest}; nothing to do")
                  else:
                      needed, target = True, sha
                      print(f"VERSION {version} is newer than latest release {latest or '(none)'}; releasing")

          with open(os.environ["GITHUB_OUTPUT"], "a") as f:
              f.write(f"needed={'true' if needed else 'false'}\n")
              f.write(f"version={version}\n")
              f.write(f"tag={tag}\n")
              f.write(f"target={target}\n")
              f.write(f"prerelease={'false' if stable else 'true'}\n")
          summary = (f"Release check: **{tag}** — " +
                     ("build + publish (create or update)" if needed else "skip, already up to date") +
                     f" (VERSION {version}, {'stable' if stable else 'prerelease'})")
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a") as f:
              f.write(summary + "\n")
          print(summary)
          PY

  build:
    name: build + test gate
    needs: check
    if: needs.check.outputs.needed == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: mlugg/setup-zig@v2
        with:
          version: 0.17.1
      - name: Repository hygiene (checksums, no vendor files, no personal data)
        run: python3 tests/hygiene.py
      - name: Build (device ARMv7 + host SIM + self-tests)
        run: ./build.sh
      - name: Cross-build Linux SIM (x86_64 musl, static, stripped)
        run: zig cc -target x86_64-linux-musl -DMERAKIPLUS_SIM -O2 -static -s src/merakiplus.c -lm -o build/merakiplus_sim-linux-x86_64
      - name: bin/ drift check (committed binaries == fresh builds)
        run: python3 tests/check_bins.py
      - name: UI self-test (preview build)
        run: |
          zig cc -DMERAKIPLUS_PREVIEW -O2 -o build/merakiplus_preview src/merakiplus.c -lm
          ./build/merakiplus_preview --selftest sim/fixtures/config.json > build/ui_selftest.txt 2>&1 || { tail -50 build/ui_selftest.txt; exit 1; }
          tail -n 1 build/ui_selftest.txt
      - name: MQTT helper + feed
        run: python3 tests/test_mqtt.py
      - name: Simulator self-test
        run: python3 sim/selftest.py
      - name: E2E quick (core scenarios against the real UI SIM build)
        run: python3 sim/run_e2e.py --all --quick --parallel 4
      - name: Gesture switcher end-to-end (file mode)
        run: python3 boot/test_switcher.py
      - name: Launcher (vendor-watchdog model + power-cut replay)
        run: python3 tests/test_launcher.py
      - name: Signed release manifests (both verifiers, signing tool, workflow manifest step)
        run: python3 tests/test_upd.py
      - name: Installer / revert against the mock display
        run: python3 tests/test_installer.py
      - name: Assemble release assets + notes (committed bin/, drift-checked above)
        env:
          VERSION: ${{ needs.check.outputs.version }}
        run: |
          mkdir -p dist
          files="merakiplus merakiplus_snd merakiplus_mqtt merakiplus_boot switcher grab_shim.so start.wav ready_extract.wav ready_steam.wav merakiplus_sim_arm merakiplus_sim-linux-x86_64 merakiplus_sim-macos-arm64"
          cp bin/merakiplus bin/merakiplus_snd bin/merakiplus_mqtt bin/merakiplus_boot bin/switcher bin/grab_shim.so audio/*.wav bin/merakiplus_sim_arm bin/merakiplus_sim-linux-x86_64 bin/merakiplus_sim-macos-arm64 dist/
          (cd dist && md5sum $files > MD5SUMS && sha256sum $files > SHA256SUMS)
          # OTA phase 2 (docs/signing.md): an UNSIGNED manifest for comparison. CI has no signing key; the maintainer
          # signs offline (tools/sign_release.py sign) and uploads manifest.json + manifest.sig afterwards.
          COMMIT="$GITHUB_SHA"
          RELEASED="$(TZ=UTC git log -1 --format=%cd --date=format-local:%Y-%m-%d)"
          python3 tools/sign_release.py manifest --dir dist --version "$VERSION" --commit "$COMMIT" --released "$RELEASED" --assets $files MD5SUMS SHA256SUMS --out dist/manifest.unsigned.json
          python3 tools/release_notes.py "$VERSION" > dist/notes.md
          cat dist/MD5SUMS dist/SHA256SUMS
      - name: Signed-release guard (never replace assets under an existing signed manifest)
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.check.outputs.tag }}
        run: |
          if gh release view "$TAG" --json assets --jq '.assets[].name' 2>/dev/null | grep -qx manifest.json; then
            gh release download "$TAG" -p manifest.json -p manifest.sig -D dist
            python3 tools/merakiplus.py verify-release dist
            rm -f dist/manifest.json dist/manifest.sig
            echo "== $TAG is signed and the rebuilt assets match its signed manifest"
          else
            echo "== $TAG has no signed manifest (yet)"
          fi
      - name: Upload release assets
        uses: actions/upload-artifact@v4
        with:
          name: release-assets
          path: dist/
          if-no-files-found: error
      - name: Upload reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: release-reports
          path: |
            sim/reports/
            build/ui_selftest.txt
          if-no-files-found: ignore

  publish:
    name: publish release
    needs: [check, build]
    if: needs.check.outputs.needed == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Download release assets
        uses: actions/download-artifact@v4
        with:
          name: release-assets
          path: dist
      - name: Create or update the release (idempotent)
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ needs.check.outputs.tag }}
          TARGET: ${{ needs.check.outputs.target }}
          PRERELEASE: ${{ needs.check.outputs.prerelease }}
        run: |
          set -eu
          title="Meraki+ ${TAG}"
          if [ "$PRERELEASE" = "true" ]; then flag="--prerelease"; else flag="--latest"; fi
          assets="dist/merakiplus dist/merakiplus_snd dist/merakiplus_mqtt dist/merakiplus_boot dist/switcher dist/grab_shim.so dist/start.wav dist/ready_extract.wav dist/ready_steam.wav dist/merakiplus_sim_arm dist/merakiplus_sim-linux-x86_64 dist/merakiplus_sim-macos-arm64 dist/MD5SUMS dist/SHA256SUMS dist/manifest.unsigned.json"
          if gh release view "$TAG" --json tagName >/dev/null 2>&1; then
            echo "== release $TAG exists -> edit notes + replace assets (no duplicate)"
            gh release edit "$TAG" --title "$title" --notes-file dist/notes.md "$flag"
            gh release upload "$TAG" $assets --clobber
          else
            echo "== release $TAG does not exist -> create"
            if [ -n "$TARGET" ]; then
              gh release create "$TAG" --target "$TARGET" --title "$title" --notes-file dist/notes.md "$flag" $assets
            else
              gh release create "$TAG" --title "$title" --notes-file dist/notes.md "$flag" $assets
            fi
          fi
          gh release view "$TAG" --json url,isPrerelease,assets --jq '{url: .url, prerelease: .isPrerelease, assets: [.assets[].name]}'